[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inhouse-confluence-mcp"
version = "0.1.0"
description = "In-house Confluence MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "In-house Platform Team"}]
dependencies = []

[project.scripts]
confluence-mcp = "confluence_mcp.main:main"
confluence-mcp-sync-spaces = "confluence_mcp.sync_spaces:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
